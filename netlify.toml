[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# /api/* peger på funktionerne. Skal stå FØR SPA-reglen nedenfor,
# ellers sluger index.html også API-kaldene.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA: alle andre ruter serveres af index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Kører hvert 15. minut og publicerer godkendte opslag hvis tiden er passeret.
[functions."planlagt-publicering"]
  schedule = "*/15 * * * *"

[build.environment]
  NODE_VERSION = "22"
